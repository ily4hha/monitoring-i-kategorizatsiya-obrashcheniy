[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-monitoring"
version = "0.1.0"
description = "Сервис категоризации, маршрутизации и аналитики обращений"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules/routing/tests"]
pythonpath = ["modules/routing"]

